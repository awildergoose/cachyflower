plugins {
    id "java"
    id("com.gradleup.shadow") version "9.5.0"
}

group = "me.awildergoose.cachyflower"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
    maven {
        url "https://repo.cleanroommc.com/releases"
    }
}

dependencies {
    implementation 'com.cleanroommc:cleanflower:1.0.0'
}

shadowJar {
    archiveClassifier = "all"
}

tasks.named("jar", Jar) {
    manifest {
        attributes "Main-Class": "me.awildergoose.cachyflower.Main"
    }
}
